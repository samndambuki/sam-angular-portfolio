<section class="section contact-section" id="contact">
  <div class="container">
    <div class="contact-grid">

      <div class="contact-left">
        <span class="section-eyebrow">Contact</span>
        <h2 class="section-title">Let's <em>Work Together</em></h2>
        <div class="divider"></div>
        <p class="contact-desc">
          I'm currently open to new opportunities. Whether you have a project in mind,
          want to discuss a role, or just want to say hi — my inbox is always open.
        </p>

        <a class="cta-email" href="mailto:sam.ndambuki08@gmail.com">
          <span>sam.ndambuki08&#64;gmail.com</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>

      <div class="contact-right">
        <div class="contact-cards">
          @for (item of contactItems; track item.label) {
            <a class="contact-card" [href]="item.href" target="_blank">
              <div class="contact-icon" [innerHTML]="item.icon"></div>
              <div class="contact-info">
                <span class="contact-label">{{ item.label }}</span>
                <span class="contact-value">{{ item.value }}</span>
              </div>
              <svg class="contact-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
          }
        </div>
      </div>

    </div>
  </div>
</section>
